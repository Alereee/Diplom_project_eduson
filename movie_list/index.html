<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../style/common.css" />
    <link rel="stylesheet" href="../style/index.css" />
    <link rel="stylesheet" href="../style/lists.css" />
    <link rel="stylesheet" href="../style/fonts.css" />
    <link rel="stylesheet" href="../style/colors.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="burger-menu-none">
      <button>
        <img src="../assets/close-burger-black.svg" />
      </button>
      <nav>
        <ul>
          <li>
            <div class="nav-li nav-li-menu">
              <a href="movie_list/index.html">Фильмы</a>
              <a href="series_list/index.html">Сериалы</a>
            </div>
          </li>
          <li>
            <div class="nav-li nav-li-theme">
              <p>Тёмная тема</p>
              <div class="theme-switch">
                <div class="switch"></div>
              </div>
            </div>
          </li>
        </ul>
      </nav>
    </div>
    <header>
      <div class="container">
        <div class="wrapper">
          <nav>
            <ul>
              <li>
                <a href="../index.html">
                  <img src="../assets/logo.svg" alt="logo" />
                </a>
              </li>
              <li>
                <div class="nav-li nav-li-menu">
                  <a href="./index.html">Фильмы</a>
                  <a href="../series_list/index.html">Сериалы</a>
                </div>
              </li>
              <li>
                <div class="nav-li nav-li-theme">
                  <p>Тёмная тема</p>
                  <div class="theme-switch">
                    <div class="switch"></div>
                  </div>
                </div>
              </li>
              <li class="burger-menu">
                <div class="nav-li nav-li-search burger-menu">
                  <img src="../assets/burger-menu.svg" alt="burger-menu" />
                </div>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </header>
    <main>
      <section class="search">
        <img
          src="../assets/search-back.png"
          alt="search"
          class="search-input"
        />
        <div class="search-input__content">
          <div class="search-input__div">
            <img
              src="../assets/search-input.png"
              alt="search"
              class="search-input__icon"
            />
            <input
              name="search"
              type="text"
              placeholder="Что сегодня посмотреть"
              class="search-input__input"
            />
            <button class="search-input__btn">Найти</button>
          </div>
        </div>
      </section>
      <section class="main-films container">
        <aside>
          <h2>Фильмы</h2>
          <form>
            <div class="aside-lab">
              <label>Жанр</label>
              <div class="select-container">
                <select name="genre" id=""></select>
              </div>
            </div>
            <div class="aside-lab">
              <label>Рейтинг</label>
              <div class="select-container">
                <select name="rating" id=""></select>
              </div>
            </div>
            <div class="aside-lab">
              <label>Страны</label>
              <div class="select-container">
                <select name="country" id=""></select>
              </div>
            </div>
            <div class="aside-lab">
              <label>Год выпуска</label>
              <div class="select-container">
                <select name="year" id=""></select>
              </div>
            </div>
          </form>
        </aside>
        <div class="main-content">
          <div class="main-content-title">
            <h2>Фильмы</h2>
            <div class="main-content-nav"></div>
          </div>
          <div class="movie-list">
            <button class="arrow-left disabled" onclick="moveSlider(-1)">
              <img
                src="../assets/arrow-slider-mobile-black.svg"
                alt="arrow-slider-mobile"
                class="arrow-slider-mobile"
              />
            </button>
            <div class="main-content-movies wrapper-movies">
              <div class="movies-slider">
                <div class="movie-card"></div>
              </div>
            </div>
            <button class="arrow-right" onclick="moveSlider(1)">
              <img
                src="../assets/arrow-slider-mobile-black.svg"
                alt="arrow-slider-mobile-black"
                class="arrow-slider-mobile"
              />
            </button>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <div class="wrapper wrapper-footer">
        <p>2026 &copy; Илья Мелехин</p>
        <div class="footer-social">
          <a href="#">
            <img src="../assets/vk-white.svg" alt="vk" class="icon-white" />
            <img
              src="../assets/vk-hover.svg"
              alt="vk-hover"
              class="icon-hover"
            />
          </a>
          <a href="#">
            <img
              src="../assets/tg-white.svg"
              alt="telegram"
              class="icon-white"
            />
            <img
              src="../assets/tg-hover.svg"
              alt="tg-hover"
              class="icon-hover"
            />
          </a>
          <a href="#">
            <img src="../assets/y-white.svg" alt="youtube" class="icon-white" />
            <img
              src="../assets/y-hover.svg"
              alt="yt-hover"
              class="icon-hover"
            />
          </a>
          <a href="#">
            <img
              src="../assets/Yandex_Zen_logo_icon.svg"
              alt="yandex"
              class="icon-white"
            />
            <img
              src="../assets/dzen-hover.svg"
              alt="yandex-hover"
              class="icon-hover"
            />
          </a>
        </div>
      </div>
    </footer>
  </body>
  <script src="../script/theme-switcher.js" defer></script>
  <script src="../script/config-movies-films.js" type="module" defer></script>
  <script src="../script/filter.js" type="module" defer></script>
  <script src="../script/filter-movies.js" type="module" defer></script>
  <script src="../script/card-movies-actual.js" type="module" defer></script>
  <script src="../script/burger-menu.js" defer></script>
  <script src="../script/slider-main.js" defer></script>
  <script src="../script/seacrh.js" defer type="module"></script>
</html>
