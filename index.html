<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style/common.css" />
    <link rel="stylesheet" href="style/index.css" />
    <link rel="stylesheet" href="style/colors.css" />
    <link rel="stylesheet" href="style/fonts.css" />
  </head>
  <body>
    <header>
      <div class="wrapper">
        <nav>
          <ul>
            <li>
              <div class="nav-li">
                <a href="#">
                  <img src="assets/logo.svg" alt="logo" />
                </a>
              </div>
            </li>
            <li>
              <div class="nav-li nav-li-menu">
                <a href="#">Фильмы</a>
                <a href="#">Сериалы</a>
              </div>
            </li>
            <li>
              <div class="nav-li nav-li-theme">
                <p>Тёмная тема</p>
                <div class="theme-switch">
                  <div class="switch"></div>
                </div>
              </div>
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <section class="space-hero">
        <div class="space-hero__content wrapper">
          <h1>Что сегодня посмотреть?</h1>
        </div>
        <img
          src="assets/sec-1-back.png"
          alt="Космонавты смотрят на планеты"
          class="section-bg-img"
        />
      </section>
      <section class="movie-list">
        <button class="arrow-left disabled" onclick="moveSlider(-1)">
          <img src="assets/arrow-right-black.svg" alt="arrow-left" />
        </button>
        <div class="wrapper-movies">
          <div class="movies-slider"></div>
        </div>
        <button class="arrow-right" onclick="moveSlider(1)">
          <img src="assets/arrow-right-black.svg" alt="arrow-right" />
        </button>
      </section>
      <section class="search">
        <img src="assets/sec-1-back.png" alt="search" class="search-input" />
        <div class="search-input__content">
          <div class="search-input__div">
            <img
              src="assets/akar-icons_vk-fill.svg"
              alt="search"
              class="search-input__icon"
            />
            <input
              name="text"
              type="text"
              placeholder="Что сегодня посмотреть"
              class="search-input__input"
            />
            <button class="search-input__btn">Найти</button>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <div class="wrapper wrapper-footer">
        <p>2026 &copy; Илья Мелехин</p>
        <div class="footer-social">
          <a href="#">
            <img src="assets/akar-icons_vk-fill.svg" alt="vk" />
          </a>
          <a href="#">
            <img src="assets/bx_bxl-telegram.svg" alt="telegram" />
          </a>
          <a href="#">
            <img src="assets/YouTube_logo 1.svg" alt="youtube" />
          </a>
          <a href="#">
            <img src="assets/Yandex_Zen_logo_icon.svg" alt="yandex" />
          </a>
        </div>
      </div>
    </footer>
  </body>
  <script src="script/config-movies.js"></script>
  <script src="script/slider-main.js"></script>
  <script src="script/theme-switcher.js" defer></script>
</html>
